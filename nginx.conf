server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Compresión básica
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Cache agresivo para assets versionados por Vite (contienen hash en el nombre)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Fallback SPA: cualquier ruta que no exista devuelve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Endpoint simple de salud para el healthcheck del contenedor / Container Apps
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
