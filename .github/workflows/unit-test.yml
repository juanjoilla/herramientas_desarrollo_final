name: Unit

on:
  # push:
  #   branches: [main]
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  build-and-test:
    name: Build & Unit Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: |
          npm install
          npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Publish Unit Test Report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Unit Tests
          path: junit.xml
          reporter: jest-junit

      - name: Add Coverage Summary
        if: always()
        run: |
          echo "## Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f coverage/coverage-summary.json ]; then
            node <<EOF >> $GITHUB_STEP_SUMMARY
            const fs = require('fs');
            const c = JSON.parse(fs.readFileSync('coverage/coverage-summary.json'));

            console.log('| Metric | Coverage |');
            console.log('|--------|---------:|');
            console.log(`| Lines | ${c.total.lines.pct}% |`);
            console.log(`| Statements | ${c.total.statements.pct}% |`);
            console.log(`| Functions | ${c.total.functions.pct}% |`);
            console.log(`| Branches | ${c.total.branches.pct}% |`);
            EOF
          else
            echo "Coverage summary not found." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      - name: Upload build artifact (dist)
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7