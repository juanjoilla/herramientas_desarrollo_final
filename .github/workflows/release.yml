name: CD - Build, Push and Deploy to Azure Container Apps

on:
  # push:
  #   branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  IMAGE_NAME: webapp-demo

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

  build-and-push:
    name: Build and push image to ACR
    needs: test
    runs-on: ubuntu-latest
    environment: production
    outputs:
      image: ${{ steps.vars.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Azure
        run: |
          az login \
            --service-principal \
            --username "${{ secrets.AZURE_CLIENT_ID }}" \
            --password "${{ secrets.AZURE_CLIENT_SECRET }}" \
            --tenant "${{ secrets.AZURE_TENANT_ID }}"

          az account set \
            --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"

      - name: Set image variables
        id: vars
        run: |
          ACR_LOGIN_SERVER=$(az acr show \
            --name "${{ vars.AZURE_ACR_NAME }}" \
            --query loginServer -o tsv)
          IMAGE="$ACR_LOGIN_SERVER/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      # Compila y publica la imagen directamente en Azure Container Registry,
      # sin necesidad de Docker instalado en el runner.
      - name: Build & push image (az acr build)
        run: |
          az acr build \
            --registry "${{ vars.AZURE_ACR_NAME }}" \
            --image "${{ env.IMAGE_NAME }}:${{ github.sha }}" \
            --image "${{ env.IMAGE_NAME }}:latest" \
            .

  deploy:
    name: Deploy to Azure Container Apps
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Login to Azure
        run: |
          az login \
            --service-principal \
            --username "${{ secrets.AZURE_CLIENT_ID }}" \
            --password "${{ secrets.AZURE_CLIENT_SECRET }}" \
            --tenant "${{ secrets.AZURE_TENANT_ID }}"

          az account set \
            --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"

      - name: Install Container Apps extension
        run: az extension add --name containerapp --upgrade -y

      - name: Get ACR credentials
        id: acr
        run: |
          ACR_LOGIN_SERVER=$(az acr show \
            --name "${{ vars.AZURE_ACR_NAME }}" \
            --query loginServer -o tsv)
          ACR_USERNAME=$(az acr credential show \
            --name "${{ vars.AZURE_ACR_NAME }}" \
            --query username -o tsv)
          ACR_PASSWORD=$(az acr credential show \
            --name "${{ vars.AZURE_ACR_NAME }}" \
            --query "passwords[0].value" -o tsv)

          echo "login_server=$ACR_LOGIN_SERVER" >> "$GITHUB_OUTPUT"
          echo "::add-mask::$ACR_PASSWORD"
          echo "username=$ACR_USERNAME" >> "$GITHUB_OUTPUT"
          echo "password=$ACR_PASSWORD" >> "$GITHUB_OUTPUT"

      # Crea la Container App si no existe todavía, o actualiza la imagen si ya existe.
      - name: Create or update Container App
        run: |
          IMAGE="${{ needs.build-and-push.outputs.image }}"

          if az containerapp show \
              --name "${{ vars.AZURE_CONTAINERAPP_NAME }}" \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" &>/dev/null; then

            echo "La Container App ya existe: actualizando imagen..."
            az containerapp update \
              --name "${{ vars.AZURE_CONTAINERAPP_NAME }}" \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --image "$IMAGE"

          else

            echo "La Container App no existe: creándola..."
            az containerapp create \
              --name "${{ vars.AZURE_CONTAINERAPP_NAME }}" \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --environment "${{ vars.AZURE_CONTAINERAPP_ENV }}" \
              --image "$IMAGE" \
              --registry-server "${{ steps.acr.outputs.login_server }}" \
              --registry-username "${{ steps.acr.outputs.username }}" \
              --registry-password "${{ steps.acr.outputs.password }}" \
              --target-port 8080 \
              --ingress external \
              --min-replicas 0 \
              --max-replicas 3 \
              --cpu 0.25 --memory 0.5Gi
          fi

      - name: Show Container App URL
        run: |
          APP_URL=$(az containerapp show \
            --name "${{ vars.AZURE_CONTAINERAPP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query "properties.configuration.ingress.fqdn" \
            -o tsv)

          echo "## 🚀 Container desplegado" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🌐 URL: https://$APP_URL" >> $GITHUB_STEP_SUMMARY
          echo "🖼️ Imagen: ${{ needs.build-and-push.outputs.image }}" >> $GITHUB_STEP_SUMMARY

          echo "Container App URL: https://$APP_URL"

